sentence=Battery voltage and deep-sleep helpers for the Guition JC8012P4A1C (10.1inch ESP32-P4 panel).
paragraph=Reads the battery through the board's 68k/100k divider on GPIO52 (calibrated ADC, averaged), estimates a rough percentage, and offers deep sleep with timer and header-pin (LP GPIO) wake. The board's IP5306 power-bank chip has no connection to the ESP32-P4, and the board never draws little enough for it to switch itself off, so there is deliberately no isCharging(), no usbPowerPresent(), no power-off and no power-button read; the README says exactly what the hardware can and cannot do.
